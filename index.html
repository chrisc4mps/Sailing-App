<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sailing Logbook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>⛵ Sailing Logbook</h1>
    <p>Log your trips. Stored right in your browser.</p>
  </header>

  <main>
    <form id="trip-form">
      <div class="form-row">
        <label for="date">Date</label>
        <input type="date" id="date" required>
      </div>
      <div class="form-row">
        <label for="departure">Departure</label>
        <input type="text" id="departure" placeholder="e.g. Newport Harbor" required>
      </div>
      <div class="form-row">
        <label for="destination">Destination</label>
        <input type="text" id="destination" placeholder="e.g. Catalina Island" required>
      </div>
      <div class="form-row">
        <label for="distance">Distance (nm)</label>
        <input type="number" id="distance" min="0" step="0.1" placeholder="e.g. 26">
      </div>
      <div class="form-row">
        <label for="notes">Notes</label>
        <textarea id="notes" rows="2" placeholder="Wind, weather, crew, anything worth remembering..."></textarea>
      </div>
      <button type="submit">Add Trip</button>
    </form>

    <section id="log">
      <div class="log-header">
        <h2>Trips</h2>
        <span id="trip-count"></span>
      </div>
      <ul id="trip-list"></ul>
      <p id="empty-state">No trips logged yet. Add your first one above!</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
