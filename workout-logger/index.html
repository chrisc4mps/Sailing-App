<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Log</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="ledger-header">
    <h1>Workout Log</h1>
    <div class="totals" id="totals"></div>
  </header>

  <main>
    <form id="entry-form" class="entry-form">
      <input type="hidden" id="entry-id">
      <div class="field-row">
        <label for="date">Date</label>
        <input type="date" id="date" required>
      </div>
      <div class="field-row">
        <label for="exercise">Exercise</label>
        <input type="text" id="exercise" placeholder="e.g. Bench press" required>
      </div>
      <div class="field-row field-row--split">
        <div>
          <label for="sets">Sets</label>
          <input type="number" id="sets" min="0" step="1" inputmode="numeric">
        </div>
        <div>
          <label for="reps">Reps</label>
          <input type="number" id="reps" min="0" step="1" inputmode="numeric">
        </div>
        <div>
          <label for="weight">Weight</label>
          <input type="number" id="weight" min="0" step="0.5" inputmode="decimal">
        </div>
      </div>
      <div class="field-row">
        <label for="notes">Notes</label>
        <input type="text" id="notes" placeholder="optional">
      </div>
      <div class="form-actions">
        <button type="submit" id="save-btn">Add entry</button>
        <button type="button" id="cancel-btn" class="secondary" hidden>Cancel</button>
      </div>
    </form>

    <section id="log" class="log"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
